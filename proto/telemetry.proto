syntax = "proto3";

package ancymon;

option go_package = "ancymon/proto;ancymonproto";

// Single telemetry measurement frame emitted by ancymon-agent at 1 Hz
message TelemetryFrame {
  string machine_id = 1;      // Persistent UUID v4 of the host machine
  string hostname = 2;        // Human-readable operating system hostname label
  int64 timestamp_unix = 3;   // Measurement epoch timestamp in seconds
  
  CpuMetrics cpu = 4;
  MemoryMetrics memory = 5;
  NetworkMetrics network = 6;
  repeated DiskPartitionMetrics disks = 7;
  
  // Reserved for future hardware extensions (e.g. GPU telemetry)
  reserved 8 to 15;
}

message CpuMetrics {
  double total_usage_percent = 1;     // Aggregate CPU utilization across all logical cores (%)
  optional double temperature_c = 2;  // Package or core temperature in Celsius (optional)
}

message MemoryMetrics {
  uint64 total_bytes = 1;             // Total physical RAM in bytes
  uint64 used_bytes = 2;              // Currently used RAM in bytes
  double usage_percent = 3;           // RAM utilization percentage (%)
}

message NetworkMetrics {
  uint64 rx_bytes_per_sec = 1;        // Download throughput in bytes per second
  uint64 tx_bytes_per_sec = 2;        // Upload throughput in bytes per second
}

message DiskPartitionMetrics {
  string mount_point = 1;             // Mount point path (e.g. /, /home, C:)
  string fs_type = 2;                 // Whitelisted filesystem type (e.g. ext4, ntfs)
  uint64 total_bytes = 3;             // Total volume capacity in bytes
  uint64 free_bytes = 4;              // Free volume space in bytes
  double usage_percent = 5;           // Volume utilization percentage (%)
}

// Ingestion acknowledgement returned by ancymon-server
message TelemetryAck {
  bool success = 1;
  int64 acknowledged_timestamp = 2;
  string message = 3;
  uint64 acknowledged_count = 4;      // Number of frames acknowledged in this stream/segment

  // Reserved for future acknowledgement metadata
  reserved 5 to 10;
}

// Telemetry streaming service operating over HTTP/2 gRPC
service TelemetryService {
  rpc StreamTelemetry(stream TelemetryFrame) returns (TelemetryAck);
}
