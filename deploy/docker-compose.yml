version: '3.8'

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: ancymon-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=90d"
      - "-httpListenAddr=:8428"
    restart: unless-stopped

  caddy:
    image: caddy:2.7.6-alpine
    container_name: ancymon-caddy
    # On Linux, host networking allows Caddy to proxy directly to localhost:50051 and localhost:8080
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  vmdata:
  caddy_data:
  caddy_config:
